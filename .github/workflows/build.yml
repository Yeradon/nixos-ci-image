name: Build & Push CI Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.target }} (${{ matrix.channel }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "26.05"
            channel: "nixos-26.05"
            input: "nixpkgs-stable"
            tags: "26.05 stable latest nixos-26.05"
          - target: "25.11"
            channel: "nixos-25.11"
            input: "nixpkgs-old"
            tags: "25.11 old-stable nixos-25.11"
          - target: "unstable"
            channel: "nixos-unstable"
            input: "nixpkgs-unstable"
            tags: "unstable nixos-unstable"

    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract nixpkgs version tag
        id: nixpkgs
        run: |
          NIXPKGS_REV=$(jq -r ".nodes[\"${{ matrix.input }}\"].locked.rev // empty" flake.lock | head -c 8)
          echo "rev=${NIXPKGS_REV}" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build container image
        run: nix build ".#${{ matrix.target }}"

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            nix shell nixpkgs#skopeo -c skopeo login \
              --username "${{ github.actor }}" \
              --password-stdin \
              ${{ env.REGISTRY }}

      - name: Push image tags
        if: github.event_name == 'push'
        run: |
          DEST="${{ env.REGISTRY }}/${IMAGE_NAME}"

          # Push all primary tags and aliases for this target
          for tag in ${{ matrix.tags }}; do
            nix shell nixpkgs#skopeo -c skopeo copy \
              --insecure-policy \
              docker-archive:./result \
              "docker://${DEST}:${tag}"
          done

          # Push pinned git commit rev tag (e.g. 26.05-21a67dc4)
          if [ -n "${{ steps.nixpkgs.outputs.rev }}" ]; then
            nix shell nixpkgs#skopeo -c skopeo copy \
              --insecure-policy \
              docker-archive:./result \
              "docker://${DEST}:${{ matrix.target }}-${{ steps.nixpkgs.outputs.rev }}"
          fi
